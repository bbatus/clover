# =============================================================================
# Clover (Payload CMS — formerly vodafonepaycomtr/cms) — standalone compose.
#
# Run FROM THIS FOLDER: `cd clover && docker compose up -d`
#
# This repo used to be the `cms/` subfolder of the vodafonepaycomtr monorepo,
# orchestrated by one shared docker-compose.yml at that repo's root. Split out
# via `git subtree split` (full history preserved) into its own repo/deployment
# — see vodafonepaycomtr/tasks.md item 39 and docs/OCP-DEVOPS-RUNBOOK.md.
#
# Postgres + MinIO moved here because Clover is their only direct consumer —
# the site never talks to either directly, only to Clover's HTTP API (see
# S3_PUBLIC_URL below: uploaded media is served to the BROWSER directly from
# MinIO's public port, not proxied through either app server).
#
# Joins the shared external Docker network `vodafonepay-net` (create once:
# `docker network create vodafonepay-net`) so the site's compose can reach
# this one by container name (`http://clover:3000`), the same way two
# Services resolve each other inside one OCP namespace.
#
# Data continuity: the two volumes below are the EXACT SAME named volumes the
# old monorepo-root compose created (`vodafonepaycomtr_postgres-data` /
# `vodafonepaycomtr_minio-data`) — marked `external: true` so this compose
# attaches to the existing data instead of creating empty ones under a new
# `clover_` prefix. Nothing was migrated/copied; it's the same disk data.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: vodafonepaycms-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-vodafonepaycms}
      - POSTGRES_USER=${POSTGRES_USER:-payload}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-payload}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payload}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vodafonepay-net

  minio:
    image: minio/minio:latest
    container_name: vodafonepaycms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-payload}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-payload-minio-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vodafonepay-net

  # One-shot: (re-)confirms the media bucket + public-read policy exist. Runs
  # against the existing bucket/data (external volume above), does nothing
  # destructive if it's already set up.
  minio-init:
    image: minio/mc:latest
    container_name: vodafonepaycms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-payload} ${MINIO_ROOT_PASSWORD:-payload-minio-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-vodafonepaycomtr-media} &&
      mc anonymous set download local/${S3_BUCKET:-vodafonepaycomtr-media}
      "
    networks:
      - vodafonepay-net

  clover:
    build:
      context: .
      dockerfile: Dockerfile
      # Must match the runtime PAYLOAD_SECRET/REVALIDATE_SECRET below — see
      # the Dockerfile comment on why a build-time/runtime mismatch here
      # silently breaks every authenticated write in the admin panel.
      args:
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-payload-secret-change-me}
        REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
        PREVIEW_SECRET: ${PREVIEW_SECRET:-dev-preview-secret}
    image: clover:latest
    container_name: clover
    restart: unless-stopped
    ports:
      - "${CMS_PORT:-3010}:3000"
    environment:
      - DATABASE_URI=postgres://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD:-payload}@postgres:5432/${POSTGRES_DB:-vodafonepaycms}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-dev-payload-secret-change-me}
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - CMS_PORT=${CMS_PORT:-3010}
      # Extra origin the admin panel is trusted from (e.g. this machine's LAN
      # IP, for logging in from a phone on the same network) — without this,
      # Payload's CSRF check silently rejects auth from any origin besides
      # SITE_URL/localhost:CMS_PORT, which looks like "login succeeds but
      # nothing ever loads".
      - CMS_LAN_URL=${CMS_LAN_URL:-}
      # Payload's own externally-reachable address. Defaults to
      # localhost:CMS_PORT for local dev; override in a real deployment
      # where the CMS has its own public domain — without this, admin-panel
      # writes (save/publish) 403 silently (see payload.config.ts).
      - CMS_SERVER_URL=${CMS_SERVER_URL:-}
      # Site container's name on the shared network — was `http://app:3000`
      # when both lived in one compose project; `app` no longer resolves
      # once the site is its own compose, so this points at its container_name.
      - SITE_REVALIDATE_URL=http://vodafonepaycomtr:3000/api/revalidate
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-dev-revalidate-secret}
      - PREVIEW_SECRET=${PREVIEW_SECRET:-dev-preview-secret}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=http://localhost:${MINIO_API_PORT:-9000}
      - S3_REGION=us-east-1
      - S3_BUCKET=${S3_BUCKET:-vodafonepaycomtr-media}
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-payload}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-payload-minio-secret}
      # TEMPORARY (local review only) — skips the admin login screen. See
      # payload.config.ts. Leave unset/false for a normal login flow.
      - CMS_AUTO_LOGIN=${CMS_AUTO_LOGIN:-false}
      - CMS_ADMIN_EMAIL=${CMS_ADMIN_EMAIL:-admin@vodafonepay.local}
      - CMS_ADMIN_PASSWORD=${CMS_ADMIN_PASSWORD:-dev-admin-please-change}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/admin').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - vodafonepay-net

networks:
  vodafonepay-net:
    external: true

volumes:
  postgres-data:
    external: true
    name: vodafonepaycomtr_postgres-data
  minio-data:
    external: true
    name: vodafonepaycomtr_minio-data
