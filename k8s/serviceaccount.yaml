# Clover ServiceAccount.
#
# Role/RoleBinding kasten yok — pod Kubernetes API'sine konuşmuyor (Payload,
# fabric8/kubernetes-client benzeri bir bağımlılık kullanmıyor); ConfigMap/
# Secret'lar envFrom ile geliyor, bunları kubelet okur, pod'un SA'sına izin
# gerekmez. TEST cluster'ında deploy kullanıcısı zaten Role/RoleBinding
# oluşturamıyor olabilir (devops-proje-sablonu'nun kendi notu) — gerçekten
# gerekirse ayrıca istenir.
#
# imagePullSecrets — ZORUNLU, containers.github.vpara.local private registry.
# `vodafone-githubtest`, namespace'te ZATEN VAR OLAN, aynı registry için
# çalışan bir secret — genaiops-event-processor'ın kendi ServiceAccount'unda
# (01.09.2026 sahada doğrulandı, `oc get sa genaiops-event-processor -o yaml`)
# BİREBİR AYNI şekilde referans veriliyor ve sorunsuz çalışıyor. Clover'a
# özel yeni bir pull secret oluşturulmasına gerek yok.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clover
  namespace: vepas-ai-am
  labels: { app: clover }
imagePullSecrets:
  - name: vodafone-githubtest
