# Clover ServiceAccount.
#
# Role/RoleBinding kasten yok — pod Kubernetes API'sine konuşmuyor (Payload,
# fabric8/kubernetes-client benzeri bir bağımlılık kullanmıyor); ConfigMap/
# Secret'lar envFrom ile geliyor, bunları kubelet okur, pod'un SA'sına izin
# gerekmez. TEST cluster'ında deploy kullanıcısı zaten Role/RoleBinding
# oluşturamıyor olabilir (devops-proje-sablonu'nun kendi notu) — gerçekten
# gerekirse ayrıca istenir.
#
# imagePullSecrets — ZORUNLU, containers.github.vpara.local private registry.
#
# ⚠️ 01.09.2026 sahada bulundu: namespace'in paylaşılan `vodafone-githubtest`
# secret'ı (genaiops-event-processor'ın da kullandığı) Clover için "denied"
# ile patladı — o secret'ın arkasındaki hesabın (`srvc.vpara.githubtst`)
# `vepas-ai/clover` reposuna/paketine erişimi yok (yeni repo, henüz
# eklenmemiş). Bunun yerine PUSH için zaten kullandığımız — ve dolayısıyla
# kesin erişimi olan — `clover-pull-secret`'ı kullanıyoruz (aynı
# REGISTRY_LOGIN_USERNAME/REGISTRY_LOGIN_TOKEN, `Log in to Container
# Registry` adımıyla aynı kimlik). Faz 0'da elle oluşturulur:
#   oc create secret generic clover-pull-secret \
#     --from-file=.dockerconfigjson=<pipeline'ın login olduğu docker config> \
#     --type=kubernetes.io/dockerconfigjson -n vepas-ai-am
# (bkz. DEPLOYMENT_RUNBOOK.md Faz 0 adım 1)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clover
  namespace: vepas-ai-am
  labels: { app: clover }
imagePullSecrets:
  - name: clover-pull-secret
