# =============================================================================
# Clover — hassas değerler. Bu bir ŞABLONDUR, repo'da GERÇEK PAROLA YOKTUR.
#
#     cp k8s/.env.secret.example k8s/.env.secret   # .gitignore'da
#     # değerleri doldur
#     ./k8s/create-secret.sh
#
# ⚠️ Pipeline bu dosyayı UYGULAMAZ — sırlar GitHub Secrets'a hiç taşınmasın diye.
# ⚠️ Doldurulmuş halini ASLA commit etmeyin.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: clover-secret
  namespace: vepas-ai-am
  labels: { app: clover }
type: Opaque
stringData:
  # Tam bağlantı string'i — bkz. k8s/configmap.yaml'daki not. Örnek (TEST,
  # gerçek DB bilgisi docs/OCP-DEVOPS-RUNBOOK.md §3'te):
  #   postgres://vpaycmstest_new_user:${DB_PASSWORD}@172.31.229.152:5432/vpaycms_test_new
  DATABASE_URI: "${DATABASE_URI}"

  PAYLOAD_SECRET: "${PAYLOAD_SECRET}"
  REVALIDATE_SECRET: "${REVALIDATE_SECRET}"
  PREVIEW_SECRET: "${PREVIEW_SECRET}"

  # Namespace-içi MinIO kimlik bilgileri (dışarı açılmıyor, create-secret.sh
  # boş bırakılırsa rastgele üretir).
  MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
  MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
  S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
  S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"

  CMS_ADMIN_EMAIL: "${CMS_ADMIN_EMAIL}"
  CMS_ADMIN_PASSWORD: "${CMS_ADMIN_PASSWORD}"
