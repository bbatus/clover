# =============================================================================
# Clover (Payload CMS) — uygulama konfigürasyonu (PAROLA YOK)
#
# ⚠️ PIPELINE TARAFINDAN UYGULANMAZ. İlk kurulumda ve her değişiklikte ELLE:
#       oc apply -f k8s/configmap.yaml -n vepas-ai-am && oc rollout restart deployment/clover -n vepas-ai-am
#
# ORTAM: TEST (tst-vcloud, namespace vepas-ai-am)
#
# ⚠️ DATABASE_URI burada YOK — Payload (payload.config.ts:537) host/port/db/
# kullanıcıyı ayrı ayrı okumuyor, TEK bir postgres:// bağlantı string'i
# okuyor. O string parola içerdiği için TAMAMEN Secret'ta
# (k8s/secret.yaml) — bkz. docs/OCP-DEVOPS-RUNBOOK.md §3.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: clover-config
  namespace: vepas-ai-am
  labels: { app: clover }
data:
  NODE_ENV: "production"
  # 18.09.2026: pods otherwise run in UTC, 3 hours behind Turkey. Correctness
  # doesn't depend on this (schedules are stored and compared as absolute
  # instants, dates are formatted with an explicit Europe/Istanbul zone), but
  # it keeps log timestamps and any stray local-time formatting in Turkish time.
  # Node honours TZ on node:24-alpine via its bundled ICU (verified).
  TZ: "Europe/Istanbul"
  ENVIRONMENT: "test"

  SITE_URL: "https://vodafonepaycomtr-vepas-ai-am.apps.tst-vcloud.vpara.local"
  # Payload'ın kendi dışa açık adresi — boşsa admin-panel yazma işlemleri
  # (kaydet/yayınla) sessizce 403 verir (payload.config.ts'nin kendi notu).
  CMS_SERVER_URL: "https://clover-vepas-ai-am.apps.tst-vcloud.vpara.local"

  # Site'ın OCP Service'i — aynı namespace içinde container/Service adıyla
  # çözülüyor (yerelde docker-compose'un container_name'i neyse burada
  # Service adı onun karşılığı).
  SITE_REVALIDATE_URL: "http://vodafonepaycomtr:3000/api/revalidate"

  # 18.09.2026 — optional, both unset on purpose (documented here so they're findable):
  # - SITE_INTERNAL_URL: Kırık Linkler's scan asks the site at SITE_REVALIDATE_URL's
  #   origin (above). Only needed if the site's in-cluster address differs from that.
  # - SCHEDULED_PUBLISH_DISABLED: "true" switches off the scheduled campaign publisher
  #   in this pod. It runs in every pod; a Postgres advisory lock lets one act per tick.
  # SITE_INTERNAL_URL: "http://vodafonepaycomtr:3000"
  # SCHEDULED_PUBLISH_DISABLED: "false"

  # ---- MinIO (namespace içinde, geçici — k8s/minio.yaml) -------------------
  # S3: kurumsal bir S3/MinIO yerine, netleşene kadar kendi MinIO'muzu bu
  # namespace'e deploy ediyoruz (S3/S4 kararı). S3_ENDPOINT Service adıyla
  # (pod-içi trafik); S3_PUBLIC_URL MinIO'nun KENDİ Route'u — yüklenen
  # medya tarayıcıya DOĞRUDAN MinIO'dan servis ediliyor, Clover'ın üzerinden
  # proxy'lenmiyor, o yüzden bunun herkese açık, gerçek bir host olması şart.
  S3_ENDPOINT: "http://clover-minio:9000"
  S3_PUBLIC_URL: "https://clover-minio-vepas-ai-am.apps.tst-vcloud.vpara.local"
  S3_REGION: "us-east-1"
  S3_BUCKET: "vodafonepaycomtr-media"

  CMS_AUTO_LOGIN: "false"

  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_APP: "INFO"
